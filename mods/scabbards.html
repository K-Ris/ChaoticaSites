</style></head>
<body><header><span class="brand">Chaotica 4.0</span><a href="../index.html">Overview</a><a href="../arcana/index.html">Arcana tree</a><a href="../quests/index.html">Quests</a><a href="../mods/index.html">Mods</a></header><main><style>

.chips span { display: inline-block; background: #2c2738; border-radius: 4px; padding: 1px 6px; margin: 2px; font-size: 12px; color: var(--muted); }

        display: flex; align-items: center; justify-content: center; }
.cell .ico { width: 24px; height: 24px; } .cell.tagged { border-color: #6b5a8a; }
.cell i { position: absolute; right: 1px; bottom: -1px; font-style: normal; font-size: 10px; font-weight: 600; color: #fff;
          text-shadow: 1px 1px 0 #000; }
.arrow { color: var(--muted); font-size: 18px; }
.deps { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; margin: 6px 0 4px; font-size: 13px; max-width: 900px; }
.deps a { color: var(--accent); } .missing { color: #ff7a7a; }
.badge { display: inline-block; margin-top: 6px; font-style: normal; font-size: 11px; padding: 1px 6px; border-radius: 4px; background: #2c2738; color: var(--muted); }
.badge.warn { background: #4a2a1a; color: #ffb27a; }
.card { position: relative; } .cardlink { color: inherit; text-decoration: none; display: block; }
.tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 10px; margin-top: 6px;
       background: hsl(var(--h) 45% 28%); color: hsl(var(--h) 80% 85%); border: 1px solid hsl(var(--h) 45% 40%); }
.tagrow { display: flex; gap: 6px; align-items: center; }
.tagbtn { margin-top: 6px; background: none; border: 1px dashed var(--border); color: var(--muted); border-radius: 10px;
          font-size: 11px; padding: 0 7px; cursor: pointer; } .tagbtn:hover { color: var(--accent); border-color: var(--accent); }
.tagbar { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
.tagbar button { background: var(--panel); border: 1px solid var(--border); color: var(--text); border-radius: 12px; padding: 2px 10px; cursor: pointer; font-size: 12px; }
.tagbar button.on { border-color: var(--accent); color: var(--accent); }
#tagman { float: right; width: 280px; margin: 0 0 12px 16px; background: var(--panel); border: 1px solid var(--accent); border-radius: 8px; padding: 10px; }
#tagman .row { display: flex; align-items: center; gap: 6px; margin: 6px 0; } #tagman .row .tag { margin: 0; flex: 1; }
#tagman button, .addtag button { background: #2c2738; color: var(--text); border: 1px solid var(--border); border-radius: 5px; cursor: pointer; padding: 1px 7px; }
.addtag { display: flex; gap: 6px; margin-top: 8px; } .addtag input { flex: 1; min-width: 0; background: #17151d; color: var(--text); border: 1px solid var(--border); border-radius: 5px; padding: 3px 6px; }
#picker { position: absolute; z-index: 20; background: #0e0c12; border: 1px solid var(--accent); border-radius: 6px; padding: 4px; min-width: 150px; }
#picker div { padding: 3px 8px; border-radius: 4px; cursor: pointer; font-size: 13px; } #picker div:hover { background: #2c2738; }
</style>
<div class="modhead"><div><h1>Nimbu&#x27;s Scabbards</h1><div class="meta"><code>scabbards</code> · 1.6.1 · [1.6.1] Nimbu&#x27;s Scabbards.jar</div><span class="tag" style="--h:247">Mechanics</span></div></div>
<p class="desc">Example mod description.</p><div class="deps"><div><b>Requires:</b> <a href="curios.html">Curios API</a></div></div><div class="tabs"><button data-tab="items">Items &amp; blocks (3)</button><button data-tab="mobs">Mobs (0)</button>
<input id="q" placeholder="Search name or id"></div>
<div id="detail"></div><div class="grid" id="grid"></div>
<script>const DATA = {"items":[{"id":"scabbards:hip_scabbard","name":"Hip Scabbard","icon":0,"tags":["#minecraft:dyeable","#scabbards:scabbard"],"found":[],"recipes":[{"t":"Crafting (shaped)","k":"shaped","id":"scabbards:hip_scabbard","in":[{"i":1,"n":"Leather"},{"i":1,"n":"Leather"},{"i":2,"n":"String"}],"out":[{"i":0,"n":"Hip Scabbard"}],"g":[[{"i":1,"n":"Leather"},null],[{"i":1,"n":"Leather"},{"i":2,"n":"String"}]]}],"used":[],"usedMore":0},{"id":"scabbards:scabbard","name":"Scabbard","icon":3,"tags":["#minecraft:dyeable","#scabbards:scabbard"],"found":[],"recipes":[{"t":"Crafting (shaped)","k":"shaped","id":"scabbards:scabbard","in":[{"i":1,"n":"Leather"},{"i":2,"n":"String"},{"i":1,"n":"Leather"}],"out":[{"i":3,"n":"Scabbard"}],"g":[[{"i":1,"n":"Leather"},{"i":2,"n":"String"}],[{"i":1,"n":"Leather"},null]]}],"used":[],"usedMore":0},{"id":"scabbards:weapon_holster","name":"Weapon Holster","icon":4,"tags":["#minecraft:dyeable","#scabbards:scabbard"],"found":[],"recipes":[{"t":"Crafting (shaped)","k":"shaped","id":"scabbards:weapon_holster","in":[{"i":1,"n":"Leather"},{"i":2,"n":"String"},{"i":2,"n":"String"}],"out":[{"i":4,"n":"Weapon Holster"}],"g":[[{"i":1,"n":"Leather"},{"i":2,"n":"String"}],[{"i":2,"n":"String"},null]]}],"used":[],"usedMore":0}],"mobs":[],"atlas":"scabbards.png","cols":40};
const D = DATA; let tab = D.items.length ? 'items' : 'mobs';
const grid = document.getElementById('grid'), detail = document.getElementById('detail'), q = document.getElementById('q');
const ico = i => `<div class="ico" style="background:url(${D.atlas}) -${(i % D.cols) * 32}px -${Math.floor(i / D.cols) * 32}px"></div>`;
const small = i => `<div class="ico" style="background:url(${D.atlas}) -${(i % D.cols) * 24}px -${Math.floor(i / D.cols) * 24}px;background-size:${D.cols * 24}px auto"></div>`;
function render() {
  document.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  const term = q.value.toLowerCase();
  grid.innerHTML = D[tab].map((e, n) => (!term || (e.name + ' ' + e.id).toLowerCase().includes(term))
    ? `<div class="entry" data-n="${n}" title="${e.id}">${ico(e.icon)}<span>${e.name}</span></div>` : '').join('');
}
function cell(c) {
  if (!c) return '<div class="cell"></div>';
  const badge = c.c ? `<i>${c.c}</i>` : c.p ? `<i>${c.p}%</i>` : '';
  return `<div class="cell${c.tag ? ' tagged' : ''}" title="${c.n}">${small(c.i)}${badge}</div>`;
}
function recipeHtml(r) {
  let inputs;
  if (r.k === 'shaped') {
    const rows = r.g.map(row => [...row, null, null, null].slice(0, 3));
    while (rows.length < 3) rows.push([null, null, null]);
    inputs = `<div class="cgrid">${rows.flat().map(cell).join('')}</div>`;
  } else if (r.k === 'shapeless') {
    const cells = [...r.in]; while (cells.length < 9 && cells.length % 3) cells.push(null);
    inputs = `<div class="cgrid">${cells.map(cell).join('')}</div>`;
  } else {
    inputs = `<div class="crow">${r.in.map(cell).join('')}</div>`;
  }
  return `<div class="recipe" title="${r.id}"><div class="rtype">${r.t}</div><div class="rbody">${inputs}
    <span class="arrow">&rarr;</span><div class="crow">${r.out.map(cell).join('')}</div></div></div>`;
}
function show(e) {
  let h = `<h3>${e.name}</h3><code>${e.id}</code>`;
  if (e.tags && e.tags.length) h += `<div class="chips">${e.tags.map(t => `<span>${t}</span>`).join('')}</div>`;
  if (e.found && e.found.length) h += `<div><b>Found in</b><ul>${e.found.map(f => `<li>${f}</li>`).join('')}</ul></div>`;
  if (e.recipes && e.recipes.length) h += `<div><b>Recipes</b><div class="recipes">${e.recipes.map(recipeHtml).join('')}</div></div>`;
  else if (e.recipes) h += '<div class="meta">No recipe in the mod files (may still exist via KubeJS).</div>';
  if (e.used && e.used.length) h += `<div><b>Used in</b><br>${e.used.map(u => `<span class="drop">${small(u.i)}${u.n}</span>`).join('')}${e.usedMore ? `<span class="meta">+${e.usedMore} more</span>` : ''}</div>`;
  if (e.drops) h += e.drops.length ? `<div><b>Drops</b><br>${e.drops.map(d => `<span class="drop">${small(d.icon)}${d.name}</span>`).join('')}</div>` : '<div class="meta">No loot table found.</div>';
  if (e.egg === false) h += '<div class="meta">No spawn egg (fallback icon).</div>';
  detail.innerHTML = h; detail.style.display = 'block';
}
grid.addEventListener('click', ev => { const el = ev.target.closest('.entry'); if (!el) return;
  document.querySelectorAll('.entry.sel').forEach(x => x.classList.remove('sel')); el.classList.add('sel'); show(D[tab][el.dataset.n]); });
document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { tab = b.dataset.tab; detail.style.display = 'none'; render(); });
q.oninput = render; render();
</script></main></body></html>
