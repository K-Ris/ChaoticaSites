const D = DATA; let tab = D.items.length ? 'items' : 'mobs';
const grid = document.getElementById('grid'), detail = document.getElementById('detail'), q = document.getElementById('q');
const ico = i => `<div class="ico" style="background:url(${D.atlas}) -${(i % D.cols) * 32}px -${Math.floor(i / D.cols) * 32}px"></div>`;
const small = i => `<div class="ico" style="background:url(${D.atlas}) -${(i % D.cols) * 24}px -${Math.floor(i / D.cols) * 24}px;background-size:${D.cols * 24}px auto"></div>`;
function render() {
  document.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  const term = q.value.toLowerCase();
  grid.innerHTML = D[tab].map((e, n) => (!term || (e.name + ' ' + e.id).toLowerCase().includes(term))
    ? `<div class="entry" data-n="${n}" title="${e.id}">${ico(e.icon)}<span>${e.name}</span></div>` : '').join('');
}
function cell(c) {
  if (!c) return '<div class="cell"></div>';
  const badge = c.c ? `<i>${c.c}</i>` : c.p ? `<i>${c.p}%</i>` : '';
  return `<div class="cell${c.tag ? ' tagged' : ''}" title="${c.n}">${small(c.i)}${badge}</div>`;
}
function recipeHtml(r) {
  let inputs;
  if (r.k === 'shaped') {
    const rows = r.g.map(row => [...row, null, null, null].slice(0, 3));
    while (rows.length < 3) rows.push([null, null, null]);
    inputs = `<div class="cgrid">${rows.flat().map(cell).join('')}</div>`;
  } else if (r.k === 'shapeless') {
    const cells = [...r.in]; while (cells.length < 9 && cells.length % 3) cells.push(null);
    inputs = `<div class="cgrid">${cells.map(cell).join('')}</div>`;
  } else {
    inputs = `<div class="crow">${r.in.map(cell).join('')}</div>`;
  }
  return `<div class="recipe" title="${r.id}"><div class="rtype">${r.t}</div><div class="rbody">${inputs}
    <span class="arrow">&rarr;</span><div class="crow">${r.out.map(cell).join('')}</div></div></div>`;
}
function show(e) {
  let h = `<h3>${e.name}</h3><code>${e.id}</code>`;
  if (e.tags && e.tags.length) h += `<div class="chips">${e.tags.map(t => `<span>${t}</span>`).join('')}</div>`;
  if (e.found && e.found.length) h += `<div><b>Found in</b><ul>${e.found.map(f => `<li>${f}</li>`).join('')}</ul></div>`;
  if (e.recipes && e.recipes.length) h += `<div><b>Recipes</b><div class="recipes">${e.recipes.map(recipeHtml).join('')}</div></div>`;
  else if (e.recipes) h += '<div class="meta">No recipe in the mod files (may still exist via KubeJS).</div>';
  if (e.used && e.used.length) h += `<div><b>Used in</b><br>${e.used.map(u => `<span class="drop">${small(u.i)}${u.n}</span>`).join('')}${e.usedMore ? `<span class="meta">+${e.usedMore} more</span>` : ''}</div>`;
  if (e.drops) h += e.drops.length ? `<div><b>Drops</b><br>${e.drops.map(d => `<span class="drop">${small(d.icon)}${d.name}</span>`).join('')}</div>` : '<div class="meta">No loot table found.</div>';
  if (e.egg === false) h += '<div class="meta">No spawn egg (fallback icon).</div>';
  detail.innerHTML = h; detail.style.display = 'block';
}
grid.addEventListener('click', ev => { const el = ev.target.closest('.entry'); if (!el) return;
  document.querySelectorAll('.entry.sel').forEach(x => x.classList.remove('sel')); el.classList.add('sel'); show(D[tab][el.dataset.n]); });
document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { tab = b.dataset.tab; detail.style.display = 'none'; render(); });
q.oninput = render; render();
