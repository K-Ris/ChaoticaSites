<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overview - Chaotica 4.0</title><style>
:root { --bg: #17151d; --panel: #221f2b; --text: #e8e4f0; --muted: #a59fb5; --accent: #d98cff; --border: #3a3448; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, Segoe UI, sans-serif; }
header { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; gap: 18px; align-items: baseline; flex-wrap: wrap; }
header a { color: var(--muted); text-decoration: none; } header a:hover { color: var(--accent); }
header .brand { color: var(--accent); font-weight: 600; font-size: 18px; }
main { padding: 16px 20px; }
h1 { font-size: 22px; margin: 4px 0 4px; } .sub { color: var(--muted); margin: 0 0 14px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 14px; color: var(--text); text-decoration: none; }
.card:hover { border-color: var(--accent); } .card b { display: block; margin-bottom: 4px; } .card span { color: var(--muted); font-size: 13px; }
.viewer { overflow: auto; border: 1px solid var(--border); border-radius: 8px; background: #121017; max-height: 82vh; }
.stage { position: relative; display: inline-block; transform-origin: 0 0; }
.stage img { display: block; image-rendering: pixelated; }
.spot { position: absolute; border-radius: 50%; cursor: help; }
.spot:hover { outline: 2px solid var(--accent); }
#tip { position: fixed; pointer-events: none; display: none; max-width: 360px; background: #0e0c12f2; border: 1px solid var(--accent);
       border-radius: 6px; padding: 8px 10px; font-size: 13px; z-index: 10; white-space: pre-line; }
#tip b { color: var(--accent); }
.controls { margin: 0 0 10px; display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 13px; }
.controls button { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 5px; padding: 3px 10px; cursor: pointer; }
</style></head>
