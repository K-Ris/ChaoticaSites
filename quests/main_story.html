.controls { margin: 0 0 10px; display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 13px; }
.controls button { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 5px; padding: 3px 10px; cursor: pointer; }

<div id="tip"></div><script>
const tip = document.getElementById('tip');
document.querySelectorAll('.spot').forEach(s => {
  s.addEventListener('mousemove', e => {
    tip.innerHTML = s.dataset.tip; tip.style.display = 'block';
    const x = Math.min(e.clientX + 14, window.innerWidth - tip.offsetWidth - 8);
    const y = Math.min(e.clientY + 14, window.innerHeight - tip.offsetHeight - 8);
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
  });
  s.addEventListener('mouseleave', () => tip.style.display = 'none');
});
let zoom = 1;
const stage = document.querySelector('.stage');
function setZoom(z) { zoom = Math.max(0.25, Math.min(3, z)); stage.style.transform = `scale(${zoom})`;
  stage.parentElement.style.setProperty('--z', zoom); document.getElementById('z').textContent = Math.round(zoom * 100) + '%'; }
document.querySelectorAll('[data-zoom]').forEach(b => b.onclick = () => setZoom(b.dataset.zoom === 'fit'
  ? stage.parentElement.clientWidth / stage.offsetWidth : zoom * parseFloat(b.dataset.zoom)));
</script></main></body></html>
